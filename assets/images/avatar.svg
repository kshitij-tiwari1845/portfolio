<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <linearGradient id="avatarGrad" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="faceGrad" x1="40" y1="40" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FED7AA"/>
      <stop offset="1" stop-color="#FDBA74"/>
    </linearGradient>
    <filter id="softGlow" x="-10" y="-10" width="180" height="180" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="160" height="160" rx="40" fill="url(#avatarGrad)"/>
  <circle cx="80" cy="80" r="70" stroke="white" stroke-opacity="0.2" stroke-width="2"/>
  
  <!-- Developer Avatar Silhouette -->
  <!-- Body -->
  <path d="M35 142C35 118 55 102 80 102C105 102 125 118 125 142" fill="#1E1B4B" fill-opacity="0.9"/>
  <path d="M48 142L80 110L112 142" stroke="white" stroke-opacity="0.3" stroke-width="2"/>
  
  <!-- Head -->
  <circle cx="80" cy="68" r="28" fill="url(#faceGrad)"/>
  
  <!-- Hair / Glasses / Modern Style -->
  <path d="M54 62C54 46 64 36 80 36C96 36 106 46 106 62C106 64 104 60 98 56C90 51 70 51 62 56C56 60 54 64 54 62Z" fill="#1E1B4B"/>
  
  <!-- Modern Stylish Glasses -->
  <rect x="62" y="62" width="15" height="11" rx="3" fill="#0F172A" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="83" y="62" width="15" height="11" rx="3" fill="#0F172A" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="77" y1="67" x2="83" y2="67" stroke="#E2E8F0" stroke-width="1.5"/>
  <path d="M55 64L62 65M98 65L105 64" stroke="#E2E8F0" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Smile -->
  <path d="M74 85C77 88 83 88 86 85" stroke="#9A3412" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Code Accent Symbol -->
  <circle cx="128" cy="36" r="16" fill="#10B981" filter="url(#softGlow)"/>
  <path d="M124 33L121 36L124 39M132 33L135 36L132 39" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
