  <text x="485" y="330" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="10">[OK] Model compiled</text>
  <text x="485" y="350" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="10">[INFO] Weights INT8 quantized</text>
