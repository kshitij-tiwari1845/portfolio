<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <defs>
    <linearGradient id="bgGrad1" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0F17"/>
      <stop offset="1" stop-color="#141A29"/>
    </linearGradient>
    <linearGradient id="neonGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6366F1"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <pattern id="gridPattern1" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad1)"/>
  <rect width="800" height="500" fill="url(#gridPattern1)"/>

  <!-- Window Container -->
  <rect x="40" y="35" width="720" height="430" rx="14" fill="#0F1420" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>
  
  <!-- Window Bar -->
  <path d="M 40 49 C 40 41.268 46.268 35 54 35 L 746 35 C 753.732 35 760 41.268 760 49 L 760 75 L 40 75 Z" fill="#141A29" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>
  <circle cx="65" cy="55" r="4.5" fill="#EF4444"/>
  <circle cx="80" cy="55" r="4.5" fill="#F59E0B"/>
  <circle cx="95" cy="55" r="4.5" fill="#10B981"/>
  <text x="400" y="59" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">neuroseg_inference_v3.py (TensorRT INT8)</text>

  <!-- Vision / Bounding Box & Neural Mesh Display -->
  <!-- Left Side: Vision Feed -->
  <rect x="65" y="95" width="370" height="340" rx="10" fill="#080B11" stroke="rgba(255, 255, 255, 0.06)"/>
  
