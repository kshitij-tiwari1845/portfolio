  <!-- Metric 1 -->
  <text x="475" y="160" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">Conv2d_1 (32x32)</text>
  <rect x="475" y="170" width="240" height="8" rx="4" fill="rgba(255, 255, 255, 0.08)"/>
  <rect x="475" y="170" width="210" height="8" rx="4" fill="#6366F1"/>

  <!-- Metric 2 -->
  <text x="475" y="210" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">Bottleneck_Res (64x64)</text>
