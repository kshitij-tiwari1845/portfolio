  <text x="100" y="118" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">TARGET 0.98</text>

  <rect x="255" y="160" width="150" height="130" rx="6" fill="none" stroke="#10B981" stroke-width="2"/>
  <rect x="255" y="142" width="80" height="18" rx="3" fill="#10B981"/>
  <text x="260" y="155" fill="#064E3B" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">MASK 0.94</text>

  <circle cx="210" cy="220" r="4" fill="#F59E0B"/>
  <circle cx="330" cy="225" r="4" fill="#38BDF8"/>
