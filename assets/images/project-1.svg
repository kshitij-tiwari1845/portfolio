  <rect x="475" y="220" width="185" height="8" rx="4" fill="#38BDF8"/>

  <!-- Metric 3 -->
  <text x="475" y="260" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">UNet_Decoder (128x128)</text>
